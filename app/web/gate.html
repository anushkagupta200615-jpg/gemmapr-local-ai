<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE GATE</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="gate">
<main class="gate-screen">
  <div class="gate-head">🚪 THE GATE</div>
  <div class="gate-sub">The System is holding your screen. Make your case.</div>
  <div id="chat" class="chat" aria-live="polite"></div>
  <form id="say" class="row">
    <input id="say-box" placeholder="Talk to the System…" autocomplete="off" required>
    <button class="btn">Send</button>
  </form>
  <div class="gate-foot"><a href="/">← back to the HUD</a></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
